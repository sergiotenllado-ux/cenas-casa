<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenas en casa</title>
<meta name="description" content="Menú de cenas semanal con Thermomix TM31 y lista de la compra">
<meta name="theme-color" content="#2f6b4f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<style>
:root{
  --bg:#f7f5f0;--card:#ffffff;--ink:#1f2421;--muted:#6b716d;--line:#e4e0d6;
  --accent:#2f6b4f;--accent-soft:#e3efe8;--today:#fff4dc;--today-line:#e9c46a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141816;--card:#1d2320;--ink:#e9ece9;--muted:#9aa39d;--line:#2c3430;
    --accent:#7cc7a0;--accent-soft:#22332a;--today:#2f2a1c;--today-line:#a8873a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--muted);font-size:.9rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:8px 16px}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 6px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.today{background:var(--today);border-color:var(--today-line)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.day{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
h2{margin:4px 0 6px;font-size:1.2rem}
h3{margin:16px 0 6px;font-size:1rem}
.meta{color:var(--muted);font-size:.88rem}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:3px 0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary .more{color:var(--accent);font-size:.85rem;font-weight:600}
details[open] summary .more{display:none}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.weeksel{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.weeksel select{flex:1;min-width:0;width:100%;text-overflow:ellipsis;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check span{flex:1}
.addrow{display:flex;gap:8px;margin:4px 0 8px}
.addrow input{flex:1;min-width:0;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.addrow button{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.del{border:0;background:transparent;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:0 6px;line-height:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 12px;border-radius:10px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{max-width:760px;margin:0 auto;padding:8px 16px 32px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>🍲 Cenas en casa</h1>
  <div class="sub" id="familia"></div>
</header>
<nav><div class="wrap">
  <button data-tab="hoy" class="on">Hoy</button>
  <button data-tab="semana">Semana</button>
  <button data-tab="compra">Compra</button>
</div></nav>
<main id="app"><div class="empty">Cargando menú…</div></main>
<footer>Las casillas marcadas se guardan en cada móvil. Con la lista compartida activada, lo que añades lo ve toda la familia.</footer>

<script>
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const nice=s=>{const d=parse(s);return DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()]};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let data,semIdx=0,tab=store.get("tab")||"hoy";
const today=iso(new Date());

function pickWeek(){
  const s=data.semanas;
  let i=s.findIndex(w=>w.dias.some(d=>d.fecha===today));
  if(i<0){ // próxima semana futura o, si no, la última
    i=s.findIndex(w=>w.lunes>today);
    if(i<0) i=s.length-1;
  }
  return i;
}

function receta(d,open){
  return `<details ${open?"open":""}><summary>
    <div class="day">${esc(nice(d.fecha))}${d.fecha===today?" · hoy":""}</div>
    <h2>${esc(d.plato)}</h2>
    <span class="tag">${esc(d.proteina)}</span><span class="meta">⏱ ${esc(d.tiempo)}</span>
    <div><span class="more">Ver receta ▾</span></div>
  </summary>
    <p class="meta">${esc(d.porque)}</p>
    <h3>Ingredientes</h3><ul>${d.ingredientes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Pasos Thermomix TM31</h3><ol>${d.pasos.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    ${d.truco?`<div class="tip">👧 <b>Truco niños:</b> ${esc(d.truco)}</div>`:""}
  </details>`;
}

function weekSelector(){
  if(data.semanas.length<2) return "";
  return `<div class="weeksel"><select id="sem">${data.semanas.map((w,i)=>`<option value="${i}" ${i===semIdx?"selected":""}>${esc(w.titulo)}</option>`).join("")}</select></div>`;
}

// ---- Lista compartida: guarda en menus.json del repo con la llave (token) guardada solo en este móvil ----
const REPO="sergiotenllado-ux/cenas-casa", FILE="menus.json";
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.split("\n").join("")),c=>c.charCodeAt(0)));
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)};
const otrosDe=w=>{let s=w.compra.find(x=>x.seccion.includes("Otros"));if(!s){s={seccion:"🧻 Otros",items:[]};w.compra.push(s)}return s};
async function ghLeer(tk){
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}?ref=main&t=${Date.now()}`,{headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(r.status===401) throw new Error("La llave no es válida o ha caducado.");
  if(r.status===403||r.status===404) throw new Error("La llave no tiene permiso sobre el repositorio cenas-casa.");
  if(!r.ok) throw new Error("GitHub respondió "+r.status);
  const f=await r.json(); return {sha:f.sha,json:JSON.parse(b64d(f.content))};
}
async function ghCambiar(lunes,cambio,mensaje){
  const tk=store.get("gh-token"); if(!tk) throw new Error("falta la llave");
  for(let intento=0;intento<3;intento++){
    const {sha,json}=await ghLeer(tk);
    const w=json.semanas.find(s=>s.lunes===lunes); if(!w) throw new Error("no encuentro esa semana en la web");
    cambio(w);
    const p=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{method:"PUT",
      headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json"},
      body:JSON.stringify({message:mensaje,content:b64e(JSON.stringify(json,null,2)+"\n"),sha,branch:"main"})});
    if(p.ok){
      json.semanas.sort((a,b)=>a.lunes.localeCompare(b.lunes));
      data=json; semIdx=Math.max(0,data.semanas.findIndex(s=>s.lunes===lunes)); return;
    }
    if(p.status===401||p.status===403||p.status===404) throw new Error("la llave no tiene permiso de escritura ("+p.status+")");
    if(p.status!==409&&p.status!==422) throw new Error("GitHub respondió "+p.status);
  }
  throw new Error("alguien estaba guardando a la vez; inténtalo de nuevo");
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const w=data.semanas[semIdx], app=$("#app");
  if(tab==="hoy"){
    const d=w.dias.find(x=>x.fecha===today);
    if(d){
      app.innerHTML=`<div class="card today">${receta(d,true)}</div>
        <div class="card"><b>🍎 Postre:</b> ${esc(w.postre)}</div>`;
    }else{
      const next=w.dias.find(x=>x.fecha>today);
      app.innerHTML=`<div class="card"><p>No hay cena planificada para hoy.</p>${next?`<p class="meta">Próxima cena planificada:</p>${receta(next,false)}`:`<p class="meta">Pídele a Claude el menú de la semana que viene.</p>`}</div>`;
    }
  }else if(tab==="semana"){
    app.innerHTML=weekSelector()+`<div class="card"><b>${esc(w.titulo)}</b><div class="meta">⚖️ ${esc(w.balance)}</div></div>`+
      w.dias.map(d=>`<div class="card ${d.fecha===today?"today":""}">${receta(d,false)}</div>`).join("")+
      `<div class="card"><b>🍎 Postre:</b> ${esc(w.postre)}</div>`;
  }else{
    const key="compra2-"+w.lunes, marks=store.get(key)||{};
    const xkey="extra-"+w.lunes, extras=store.get(xkey)||[];
    const tk=!!store.get("gh-token");
    app.innerHTML=weekSelector()+`<div class="row"><button class="btn" id="limpiar">Desmarcar todo</button><button class="btn" id="copiar">Copiar lista</button></div>`+
      `<div class="card"><h3 style="margin-top:0">➕ Añadir a la lista</h3>
        <form id="addf" class="addrow"><input id="addi" placeholder="Ej.: papel de albal, detergente…" maxlength="80" enterkeyhint="done" autocomplete="off"><button class="btn" type="submit" id="addb">Añadir</button></form>
        <div class="meta" id="addmsg">${tk
          ?`👨‍👩‍👧‍👦 Lista compartida activada: lo que añadas lo verá toda la familia (aparece en la sección 🧻 Otros). <a href="#" id="ghoff">Desactivar en este móvil</a>`
          :`📱 Ahora se guarda solo en este móvil. <a href="#" id="ghon">🔑 Activar lista compartida</a>`}</div>
        ${extras.length?`<div class="meta" style="margin-top:8px">Solo en este móvil:</div>`:""}
        ${extras.map((x,i)=>`<div class="check ${x.done?"done":""}"><input type="checkbox" data-x="${i}" ${x.done?"checked":""}><span>${esc(x.t)}</span><button class="del" data-del="${i}" aria-label="Quitar ${esc(x.t)}">✕</button></div>`).join("")}
      </div>`+
      w.compra.map(s=>{const esOtros=s.seccion.includes("Otros");return `<div class="card"><h3 style="margin-top:0">${esc(s.seccion)}</h3>${
        s.items.map(it=>{const id=s.seccion+"|"+it;return `<div class="check ${marks[id]?"done":""}"><input type="checkbox" data-id="${esc(id)}" ${marks[id]?"checked":""}><span>${esc(it)}</span>${esOtros&&tk?`<button class="del" data-sdel="${esc(it)}" aria-label="Quitar ${esc(it)}">✕</button>`:""}</div>`}).join("")
      }</div>`}).join("")+
      `<div class="card"><b>✅ Revisa que tienes en casa:</b> ${esc(w.revisa)}</div>`;
    app.querySelectorAll("input[data-id]").forEach(c=>c.onchange=()=>{
      marks[c.dataset.id]=c.checked; store.set(key,marks); c.parentElement.classList.toggle("done",c.checked);
    });
    app.querySelectorAll("input[data-x]").forEach(c=>c.onchange=()=>{
      extras[+c.dataset.x].done=c.checked; store.set(xkey,extras); c.parentElement.classList.toggle("done",c.checked);
    });
    app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{extras.splice(+b.dataset.del,1);store.set(xkey,extras);render()});
    const msg=t=>{$("#addmsg").textContent=t};
    $("#addf").onsubmit=async e=>{
      e.preventDefault(); const t=$("#addi").value.trim(); if(!t) return;
      if(!store.get("gh-token")){extras.push({t,done:false}); store.set(xkey,extras); render(); $("#addi").focus(); return;}
      $("#addb").disabled=true; msg("Guardando en la lista de la familia…");
      try{
        await ghCambiar(w.lunes,ww=>{const s=otrosDe(ww); if(!s.items.includes(t)) s.items.push(t)},"Lista de la compra: añadir "+t);
        render(); $("#addi").focus(); msg("✅ Añadido. Los demás lo verán al recargar la web (tarda 1-2 min).");
      }catch(err){$("#addb").disabled=false; msg("❌ No se pudo guardar: "+err.message);}
    };
    app.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=async()=>{
      const t=b.dataset.sdel; if(!confirm("¿Quitar «"+t+"» de la lista de toda la familia?")) return;
      b.disabled=true; msg("Quitando…");
      try{await ghCambiar(w.lunes,ww=>{const s=otrosDe(ww); s.items=s.items.filter(i=>i!==t); if(!s.items.length) ww.compra=ww.compra.filter(x=>x!==s)},"Lista de la compra: quitar "+t); render(); msg("✅ Quitado.");}
      catch(err){b.disabled=false; msg("❌ No se pudo quitar: "+err.message);}
    });
    const on=$("#ghon"); if(on) on.onclick=async e=>{
      e.preventDefault();
      const t=(prompt("Pega aquí la llave de GitHub (empieza por github_pat_). Solo se guarda en este móvil.")||"").trim(); if(!t) return;
      msg("Comprobando la llave…");
      try{await ghLeer(t); store.set("gh-token",t); render(); msg("✅ Lista compartida activada en este móvil.");}
      catch(err){msg("❌ "+err.message);}
    };
    const off=$("#ghoff"); if(off) off.onclick=e=>{e.preventDefault(); if(confirm("¿Quitar la llave de este móvil? Lo ya añadido se queda en la lista.")){try{localStorage.removeItem("gh-token")}catch(_){} render();}};
    $("#limpiar").onclick=()=>{store.set(key,{});extras.forEach(x=>x.done=false);store.set(xkey,extras);render()};
    $("#copiar").onclick=async()=>{
      const mias=extras.length?"📝 Mis cosas\n"+extras.map(x=>"- "+x.t).join("\n")+"\n\n":"";
      const txt=w.titulo+"\n\n"+mias+w.compra.map(s=>s.seccion+"\n"+s.items.map(i=>"- "+i).join("\n")).join("\n\n")+"\n\nRevisa en casa: "+w.revisa;
      try{await navigator.clipboard.writeText(txt);$("#copiar").textContent="¡Copiada!"}catch(e){$("#copiar").textContent="No se pudo copiar"}
    };
  }
  const sel=$("#sem"); if(sel) sel.onchange=()=>{semIdx=+sel.value;render()};
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;store.set("tab",tab);render();window.scrollTo(0,0)});

fetch("menus.json?v="+Date.now()).then(r=>r.json()).then(j=>{
  data=j; $("#familia").textContent=j.familia||"";
  data.semanas.sort((a,b)=>a.lunes.localeCompare(b.lunes));
  semIdx=pickWeek(); render();
}).catch(()=>{$("#app").innerHTML='<div class="empty">No se pudo cargar el menú.</div>'});
</script>
</body>
</html>
